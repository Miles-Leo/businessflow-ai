[project]
name = "businessflow-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ipython>=9.18.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.9",
    "langchain-mineru>=0.1.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "pymilvus>=3.0.2",
    "pypdf>=6.21.4",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
